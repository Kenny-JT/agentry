# Publish a release's files to npm as agentry-mcp, agentry-watch and opencode-agentry.
# Runs when a release is published, or by hand for an existing tag (Actions -> npm -> Run workflow).
# Needs the NPM_TOKEN secret (an npm automation token); without it the job only dry-runs.
name: npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern agentry.js --pattern agentry-watch.mjs --pattern agentry-mcp.mjs --dir release

      - name: Build the npm packages
        run: node scripts/npm-packages.mjs release "$TAG" npm

      - name: Publish
        run: |
          for dir in npm/*/; do
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              npm publish "$dir" --access public --provenance
            else
              echo "NPM_TOKEN is not set, so this is a dry run for $dir"
              npm publish "$dir" --dry-run
            fi
          done
