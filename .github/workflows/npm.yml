# Publish a release's files to npm as agentry-mcp, agentry-watch and opencode-agentry.
# Runs when a release is published, or by hand for an existing tag (Actions -> npm -> Run workflow).
# Signs in to npm with trusted publishing (OIDC), so no token is stored: on npmjs.com each package
# lists Kenny-JT/agentry and npm.yml as its trusted publisher, with `npm publish` allowed.
name: npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern agentry.js --pattern agentry-watch.mjs --pattern agentry-mcp.mjs --dir release

      - name: Build the npm packages
        run: node scripts/npm-packages.mjs release "$TAG" npm

      - name: Publish
        run: |
          for dir in npm/*/; do
            name=$(basename "$dir")
            if [ -n "$(npm view "$name@${TAG#v}" version 2>/dev/null)" ]; then
              echo "$name@${TAG#v} is already on npm, skipping it"
            else
              npm publish "$dir" --access public
            fi
          done
